name: Verify editorial website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify static pages and assets
        run: |
          test -f .nojekyll
          test -f CNAME
          test -f index.html
          test -f experience/index.html
          test -f assets/style.css
          test -f assets/site.js
          test -f papers/soft-separation/index.html
          test -f papers/robust-contextual-optimization/index.html
          test -f talks/informs-2026/index.html
